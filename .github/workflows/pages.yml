name: Engine Atlas — GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and package static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and run regression tests
        run: npm run check
      - name: Package only the public site files
        run: |
          mkdir -p _site
          cp index.html style.css main.mjs catalog.mjs physics.mjs scene.mjs hermes.mjs _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/main.mjs
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy and smoke-test live URL
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public site and JavaScript assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking ${PAGES_URL}"
          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error --max-time 20 "${PAGES_URL}" -o /tmp/engine-atlas-index.html \
              && grep -q 'Engine Atlas' /tmp/engine-atlas-index.html \
              && curl --fail --location --silent --show-error --max-time 20 "${PAGES_URL%/}/main.mjs" -o /dev/null \
              && curl --fail --location --silent --show-error --max-time 20 "${PAGES_URL%/}/scene.mjs" -o /dev/null; then
              echo "Live Pages smoke test passed: ${PAGES_URL}"
              exit 0
            fi
            echo "Not live yet (attempt ${attempt}/30); retrying"
            sleep 10
          done
          echo "::error::GitHub Pages did not serve the expected HTML and module assets"
          exit 1
