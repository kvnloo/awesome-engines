name: Verify Engine Atlas on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and live GitHub Pages smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JavaScript checks and regression tests
        run: npm run check
      - name: Check published HTML and every local asset
        env:
          SITE: https://kvnloo.github.io/awesome-engines/
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking live site: ${SITE}"
          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error --max-time 20 "${SITE}" -o /tmp/engine-atlas-index.html \
                && grep -q '<title>Engine Atlas' /tmp/engine-atlas-index.html; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "::error::The live GitHub Pages URL did not serve Engine Atlas"
              exit 1
            fi
            echo "Site not ready yet (${attempt}/30), retrying..."
            sleep 10
          done
          for filename in index.html style.css main.mjs catalog.mjs physics.mjs scene.mjs hermes.mjs; do
            echo "Verifying ${filename}"
            curl --fail --location --silent --show-error --max-time 30 "${SITE}${filename}" -o "/tmp/${filename}"
            if ! cmp -s "${filename}" "/tmp/${filename}"; then
              echo "::error::Live ${filename} does not match main. Sync main to the gh-pages publishing branch."
              exit 1
            fi
          done
          echo "All published files match main. Site: ${SITE}"
